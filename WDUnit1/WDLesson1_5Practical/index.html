<!DOCTYPE html>
<!-- WD Lesson 1.5: How can we group elements on a page? -->
<!-- Resources 
      https://www.w3schools.com/html/html_blocks.asp
-->
<html>
  <head>
    <title>Exploring Containers</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <!-- Challenge 1: Add the necessary containers to create each of the section shown in WDLesson1_5PracticalDiagram.png -->
    <div class="container">
        <h1>Exploring Containers</h1>
        <p>
          <img src="WDLesson1_5PracticalDiagram.png" height="250">
        </p>
    </div>
     <div class="container">
        <h2>Second Section</h2>
        <p>
          <a href="https://www.google.com/?safe=active&ssui=on" target="_blank"> Google </a><br>
          <a href="https://www.amazon.com/" target="_blank"> Amazon </a><br>
          <a href="https://orteil.dashnet.org/cookieclicker/" target="_blank"> Cookie Clicker </a>
        </p>
    </div>
    <!-- Challenge 2: Within each container created, add the HTML elements specified in WDLesson1_5PracticalDiagram.png
         Note: Images for the last container are stored in the images folder.  Make the images the same height -->
<div class="container">
    <img src="images/face.jpg" height="100">
    <img src="images/sun.jpg" height="100">
    <img src="images/sign.jpg" height="100">
</div>
  </body>
</html>
